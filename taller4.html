<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 1: Par o impar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 4: Formulario de registro</h1>
        <p>Desarrolla un programa que valide los datos de registro de un usuario y muestre el primer error que encuentre.</p>
    </header>

    <main>
        <form id="formTaller4" novalidate>
            <label for="nombre">Ingrese su nombre.</label>
            <input type="text" id="nombre" step="any">

            <label for="edad">Ingrese su edad.</label>
            <input type="number" id="edad" step="1">

            <label for="correo">Ingrese su email.</label>
            <input type="email" id="correo">

            <label for="contraseña">Ingrese su contraseña.</label>
            <input type="password" id="contraseña">

            <label for="confirmarContraseña">Confirme su contraseña.</label>
            <input type="password" id="confirmarContraseña">

            <div class="botones">
                <input type="submit" value="Verificar">
                <input type="reset" value="Limpiar">

                
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller4.js"></script>
</body>
</html>
