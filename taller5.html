<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Sumar dos números</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Ejercicio 1: Sumar dos números</h1>
        <p>Evento click del botón con una función anónima.</p>
    </header>

    <main>
        <form id="formTaller5" novalidate>
            <label for="operacion">Operación:</label>
            <select id="operacion">
                <option value="">Selecciona una operación</option>
                <option value="suma">Suma (+)</option>
                <option value="resta">Resta (−)</option>
                <option value="multiplicacion">Multiplicación (×)</option>
                <option value="division">División (÷)</option>
            </select>
            <label for="n1">Número 1:</label>
            <input type="number" id="n1" step="any" required>

            <label for="n2">Número 2:</label>
            <input type="number" id="n2" step="any" required>

            <div class="botones">
                <input type="submit" value="Aceptar" id="calcular">
                <input type="reset" value="Cancelar">
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/taller5.js"></script>
</body>
</html>
